name: Supabase Keepalive

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Auth Health
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://vfkdoizfokljhiptdukl.supabase.co/auth/v1/health" \
            -H "apikey: sb_publishable_JWUtP_rG5CY--IlNSMqTRw_IdCoarHM")
          echo "HTTP status: ${code}"
          if [ "${code}" -ge 400 ]; then
            echo "::warning::Supabase responded with ${code}"
            exit 1
          fi
