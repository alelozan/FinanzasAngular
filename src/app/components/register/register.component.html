<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Mis Finanzas</h2>
      <p>Crea tu cuenta para empezar a organizar tus gastos</p>
    </div>

    <form (submit)="onRegister()" class="auth-form">
      <div class="input-group">
        <label for="email">Correo Electrónico</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          placeholder="ejemplo@correo.com" 
          required
        >
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="password" 
          placeholder="••••••••" 
          required
        >
      </div>

      <button type="submit" class="btn-primary">
        Registrarse
      </button>
    </form>

   <div class="auth-footer">
  <span>¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></span>
</div>
  </div>
</div>
