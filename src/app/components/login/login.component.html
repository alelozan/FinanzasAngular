<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Bienvenido</h2>
      <p>Ingresa tus datos para gestionar tus finanzas</p>
    </div>

    <form (submit)="onLogin()" class="auth-form">
      <div class="input-group">
        <label for="email">Correo Electrónico</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          placeholder="tu@email.com" 
          required
        >
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="password" 
          placeholder="••••••••" 
          required
        >
      </div>

      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? 'Cargando...' : 'Entrar' }}
      </button>
    </form>

    <div class="auth-footer">
      <span>¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a></span>
    </div>
  </div>
</div>
